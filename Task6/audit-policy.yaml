# Политика аудита для Minikube (пример из задания 6).
# roles/rolebindings — в группе rbac.authorization.k8s.io (не в core ""),
# иначе эскалация RoleBinding уидет только в Metadata catch-all без тела.
apiVersion: audit.k8s.io/v1
kind: Policy
rules:
  - level: RequestResponse
    verbs: ["create", "delete", "update", "patch", "get", "list"]
    resources:
      - group: ""
        resources: ["pods", "pods/exec", "secrets", "configmaps", "serviceaccounts"]
      - group: "rbac.authorization.k8s.io"
        resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
  - level: Metadata
    resources:
      - group: "*"
        resources: ["*"]
